# CarbonSight API + Postgres + WattTime cache worker
# Run: docker-compose -f carbonsight/infra/docker/docker-compose.yml up -d
# API default host port 8001 (matches CARBONSIGHT_API_URL=http://localhost:8001)

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: carbonsight
      POSTGRES_PASSWORD: carbonsight
      POSTGRES_DB: carbonsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/schemas.sql:/docker-entrypoint-initdb.d/01-schema.sql

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8001:8000"
    environment:
      WATTTIME_USERNAME: ${WATTTIME_USERNAME:-}
      WATTTIME_PASSWORD: ${WATTTIME_PASSWORD:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      CARBON_PRICE_USD_PER_TON: ${CARBON_PRICE_USD_PER_TON:-50}
      DATABASE_URL: postgresql://carbonsight:carbonsight@db:5432/carbonsight
    depends_on:
      - db

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "-m", "worker.fetch_watttime"]
    working_dir: /app/apps
    environment:
      WATTTIME_USERNAME: ${WATTTIME_USERNAME:-}
      WATTTIME_PASSWORD: ${WATTTIME_PASSWORD:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-900}
      DATABASE_URL: postgresql://carbonsight:carbonsight@db:5432/carbonsight
      PYTHONPATH: /app/packages/core:/app/apps/api:/app/apps
    depends_on:
      - db
      - api

volumes:
  pgdata:
